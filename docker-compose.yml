version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: devflow-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: devflow-ml
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devflow-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/devflow
      - JWT_SECRET=${JWT_SECRET}
      - PORT=5000
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_ML_API_URL=http://localhost:8000
    container_name: devflow-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_ML_API_URL=http://localhost:8000
    depends_on:
      - backend
      - ml

volumes:
  mongo_data: