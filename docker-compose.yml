services:
  mongo:
    image: mongo:7
    container_name: devflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  ml:
    build: ./ml
    container_name: devflow-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}

  backend:
    build: ./backend
    container_name: devflow-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/devflow-ai
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_ML_API_URL: ${VITE_ML_API_URL:-http://localhost:8000}
    container_name: devflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
      - ml

volumes:
  mongo-data: